name: CI

on:
  # Branch pushes reach CI through their pull request. Running on every push
  # as well would report each required check twice on a maintainer's own
  # branch, and a duplicated context is an ambiguous merge gate.
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build / vet / gofmt / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: vet (tag-gated packages)
        run: |
          go vet -tags live ./provider/ ./agent/ ./examples/... ./decide/
          go vet -tags integration ./embed/
          go vet -tags integration ./sandbox/
      - name: gofmt
        # Docs (CLAUDE.md / AGENTS.md Build & Test) promise a clean gofmt
        # tree; CI enforces it so the doc stays true.
        run: test -z "$(gofmt -l .)"

      - name: test
        run: go test -race -count=1 ./...

      - name: live registry parity (live tag, no credentials)
        # TestLiveCaseParity lives behind the `live` build tag, so the plain
        # `go test ./...` above never runs it. It checks that every live case
        # descriptor has a body and every body has a descriptor. `-run` selects
        # only that test: no live case body runs, no vendor is dialed, and no
        # credential is needed. `!cancelled()` reports it even when the plain
        # test step failed.
        if: ${{ !cancelled() }}
        run: go test -tags live -count=1 -run 'TestLiveCaseParity' ./provider/

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # golangci-lint-action manages its own cache; avoid double-caching.
          cache: false

      - name: golangci-lint
        # The action must resolve golangci-lint v2 binaries: v6 of the action
        # installs golangci-lint v1 (built with go1.24), which cannot load our
        # v2-schema .golangci.yml or target go 1.25. v9 of the action runs on
        # node24; v8 ran node20, which GitHub removes on 2026-09-23. The
        # linter binary is PINNED (not latest) so the lint verdict is
        # reproducible across point releases.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: golangci-lint (integration and live build tags)
        # The plain run above does not compile files behind the `integration`
        # and `live` build tags, so it cannot see findings in them. This run
        # adds the tags; it does not replace the plain run, which still
        # reports a non-test func whose only caller is a tagged test. Both
        # read the repo's .golangci.yml. `!cancelled()` makes this step run
        # when the plain step failed, so one pull request reports findings
        # from both runs. A second `uses:` (the action passes `args` through
        # to `golangci-lint run`) needs nothing from the failed step's PATH.
        if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --build-tags integration,live ./...

      - name: golangci-lint (GOOS=darwin)
        # sandbox/clone_other.go and bwrap_proc_other.go carry a `!linux` build
        # constraint, and write_other.go carries `!unix`, so the ubuntu runs
        # above never compile them. GOOS=darwin compiles the first two; the
        # GOOS=windows step below compiles all three.
        # The action execs the linter with the step's environment (it sets no
        # env of its own), so GOOS reaches the linter and it loads packages
        # for that target. Plain tags: the integration and live files are not
        # part of this run. `!cancelled()` as in the tagged run above.
        if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: darwin
        with:
          version: v2.13.2
          args: ./...

      - name: golangci-lint (GOOS=windows)
        if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: windows
        with:
          version: v2.13.2
          args: ./...

  sandbox-integration:
    name: sandbox integration (bwrap + container CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: allow unprivileged user namespaces
        # Ubuntu 24.04 runners ship an AppArmor restriction that denies
        # unprivileged userns the capabilities bwrap needs (loopback setup
        # fails with RTM_NEWADDR EPERM). Lift it so the bwrap suite executes
        # rather than skipping.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: sandbox integration tests
        # The bwrap suite runs when unprivileged user namespaces work; the
        # CLI suite runs against the preinstalled docker. Both auto-skip on
        # hosts where their backend is unavailable, so this job never fails
        # on a runner capability change — it just exercises less.
        run: go test -tags integration -count=1 ./sandbox/...
