version: "2"

linters:
  # Conservative set: golangci-lint v2's "standard" five (errcheck, govet,
  # ineffassign, staticcheck, unused) plus misspell — high-signal,
  # behavior-level checks only. Formatting is enforced by gofmt at the gate,
  # not by a formatter linter here, and stricter linters (wrapcheck,
  # exhaustive, ...) are deliberately not enabled on a fresh import.
  default: standard
  enable:
    - misspell
  settings:
    staticcheck:
      checks:
        - all
        # Keep staticcheck v2's default style exclusions (below) and add
        # SA1019: the only finding is embed/retry.go's ne.Temporary() call
        # (deprecated since Go 1.18). Replacing it changes which transport
        # errors are classified retryable — a behavior decision, not a
        # mechanical fix — so the rule stays off until that policy is
        # revisited deliberately.
        - -SA1019
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
