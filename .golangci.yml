version: "2"

linters:
  # Conservative set: golangci-lint v2's "standard" five (errcheck, govet,
  # ineffassign, staticcheck, unused) plus misspell — high-signal,
  # behavior-level checks only. Formatting is enforced by the CI gofmt step
  # (mirrored in the docs' Build & Test gate), not by a formatter linter
  # here, and stricter linters (wrapcheck, exhaustive, ...) are deliberately
  # not enabled on a fresh import.
  default: standard
  enable:
    - misspell
  settings:
    staticcheck:
      checks:
        # staticcheck v2's default style exclusions stay off (package
        # comments, naming, receiver consistency, doc-comment placement).
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    rules:
      # embed/retry.go classifies transport errors with the deprecated
      # net.Error.Temporary (SA1019, deprecated Go 1.18). Replacing it
      # changes which errors are classified retryable — a behavior decision,
      # not a mechanical fix — so the one call site is excluded BY PATH, and
      # a new deprecated call anywhere else in the module is still reported.
      - path: embed/retry\.go
        linters:
          - staticcheck
        text: "SA1019: ne.Temporary"
